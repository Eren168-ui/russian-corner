name: Build and release Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Clients/Windows/package-lock.json
            Clients/Universal/package-lock.json

      - name: Install Universal client dependencies
        working-directory: Clients/Universal
        run: npm ci

      - name: Install Windows shell dependencies
        working-directory: Clients/Windows
        run: npm ci

      - name: Build Windows installer
        working-directory: Clients/Windows
        run: npm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Clients/Windows/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Clients/Windows/dist/*.exe
          generate_release_notes: true
